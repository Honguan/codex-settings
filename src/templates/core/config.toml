# Primary interactive and default model. This matches codex-model-router Terra.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
personality = "pragmatic"

# /review uses the current session model by default, so no separate
# review_model override is needed while Terra is the primary model.

# Detect Git and CVS repositories without adding marker files to projects.
project_root_markers = [".git", "CVS"]

# AGENTS.md remains the preferred filename. These names are compatibility fallbacks.
project_doc_fallback_filenames = ["AGENT.md", "agent.md"]
project_doc_max_bytes = 65536

# Browser automation through Microsoft's official Playwright MCP server.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120
