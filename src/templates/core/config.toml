# Primary interactive and default model. This matches codex-model-router Terra.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
personality = "pragmatic"
sandbox_mode = "workspace-write"

# /review uses the current session model by default, so no separate
# review_model override is needed while Terra is the primary model.

# Detect Git and CVS repositories without adding marker files to projects.
project_root_markers = [".git", "CVS"]

# AGENTS.md remains the preferred filename. These names are compatibility fallbacks.
project_doc_fallback_filenames = ["AGENT.md", "agent.md"]
project_doc_max_bytes = 65536

# Context7 remote MCP. The installer can store CONTEXT7_API_KEY in the
# current user's environment; Codex sends it without writing the secret here.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }

# Browser automation through Microsoft's official Playwright MCP server.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120

[windows]
sandbox = "elevated"
