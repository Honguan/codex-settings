name: Release single-file installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Invalid release tag: $env:GITHUB_REF_NAME. Expected vMAJOR.MINOR.PATCH."
          }
      - name: Validate installer
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag must point to a commit on main: $env:GITHUB_SHA" }
          $failed = @()
          Get-ChildItem ./tests/*.tests.ps1 | Sort-Object Name | ForEach-Object {
            & pwsh -NoLogo -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { throw "Failed tests: $($failed -join ', ')" }
      - name: Build single-file installer
        shell: pwsh
        run: ./tools/build-installer.ps1 -Version $env:GITHUB_REF_NAME
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/CodexSettings-Setup-$env:GITHUB_REF_NAME.cmd"
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset --generate-notes
          }
