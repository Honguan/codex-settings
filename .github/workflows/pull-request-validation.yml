name: Pull request validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Validate Issue workflow
    runs-on: windows-latest
    steps:
      - name: Validate branch and PR metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PR_BASE_REF -ne 'main') {
              throw "Issue PR base must be main; received '$($env:PR_BASE_REF)'."
          }

          $branchMatch = [regex]::Match($env:PR_HEAD_REF, '^issue/(?<issueNumber>\d+)-[a-z0-9]+(?:-[a-z0-9]+)*$')
          if (-not $branchMatch.Success) {
              throw "Issue PR head must match issue/<issue-number>-<short-description>; received '$($env:PR_HEAD_REF)'."
          }

          $issueNumber = [int]$branchMatch.Groups['issueNumber'].Value
          $prNumber = [int]$env:PR_NUMBER
          $issue = gh api "repos/$($env:REPOSITORY)/issues/$issueNumber" | ConvertFrom-Json
          if ($issue.state -ne 'open') {
              throw "Referenced Issue #$issueNumber is not open."
          }

          $body = [string]$env:PR_BODY
          $referencePattern = '(?im)^\s*Refs\s+#' + $issueNumber + '\b'
          if ($body -notmatch $referencePattern) {
              throw "PR body must contain 'Refs #$issueNumber'."
          }

          $closingPattern = '(?im)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\s*' + $issueNumber + '\b'
          if ($body -match $closingPattern) {
              throw "PR body must not close Issue #$issueNumber before main verification."
          }

          $commits = @(gh api "repos/$($env:REPOSITORY)/pulls/$prNumber/commits?per_page=100" | ConvertFrom-Json)
          $issueReference = '(?i)#\s*' + $issueNumber + '\b'
          $titleReferencesIssue = $env:PR_TITLE -match $issueReference
          $commitReferencesIssue = @($commits | Where-Object { [string]$_.commit.message -match $issueReference }).Count -gt 0
          if (-not $titleReferencesIssue -and -not $commitReferencesIssue) {
              throw "PR title or at least one commit must contain Issue #$issueNumber."
          }

          Write-Host "Issue workflow metadata passed for #$issueNumber on $($env:PR_HEAD_REF)."

  tests:
    name: Run repository tests
    needs: policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run PowerShell tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()
          Get-ChildItem ./tests/*.tests.ps1 | Sort-Object Name | ForEach-Object {
              & pwsh -NoLogo -NoProfile -File $_.FullName
              if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { throw "Failed tests: $($failed -join ', ')" }
