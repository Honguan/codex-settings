name: Issue close guard

on:
  issues:
    types:
      - closed

concurrency:
  group: issue-close-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  verify:
    name: Verify main before Issue close
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reopen Issue when main verification is missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $issueNumber = [int]$env:ISSUE_NUMBER
          $comments = @(gh api "repos/$($env:REPOSITORY)/issues/$issueNumber/comments?per_page=100" | ConvertFrom-Json)
          $marker = '<!-- codex-settings-main-verification:v1 -->'
          $receiptComment = $comments | Where-Object { [string]$_.body -match [regex]::Escape($marker) } | Sort-Object created_at -Descending | Select-Object -First 1
          $failureReason = $null
          if ($null -eq $receiptComment) {
              $timeline = @(gh api "repos/$($env:REPOSITORY)/issues/$issueNumber/timeline?per_page=100" -H 'Accept: application/vnd.github+json' | ConvertFrom-Json)
              $crossReference = $timeline | Where-Object {
                  $_.event -eq 'cross-referenced' -and $null -ne $_.source.issue.pull_request
              } | Select-Object -Last 1
              if ($null -ne $crossReference) {
                  $relatedPullRequest = gh api "repos/$($env:REPOSITORY)/pulls/$($crossReference.source.issue.number)" | ConvertFrom-Json
                  if ($relatedPullRequest.base.ref -eq 'main' -and $null -ne $relatedPullRequest.merged_at) {
                      Write-Host "Issue #$issueNumber is linked to merged PR #$($relatedPullRequest.number); receipt is pending from main-validation, so close verification is deferred without reopen. API calls=3 (receipt, timeline, PR fallback)."
                      exit 0
                  }
              }
              $failureReason = "no main-verification receipt for Issue #$issueNumber"
          } else {
              $receipt = [string]$receiptComment.body
              $receiptIssue = [regex]::Match($receipt, '(?im)^Issue:\s+#(?<number>\d+)\s*$')
              $receiptStatus = [regex]::Match($receipt, '(?im)^MainVerification:\s*(?<status>\S+)\s*$')
              $receiptCommit = [regex]::Match($receipt, '(?im)^MergeCommit:\s*(?<sha>[0-9a-f]{40})\s*$')
              if (-not $receiptIssue.Success -or [int]$receiptIssue.Groups['number'].Value -ne $issueNumber -or -not $receiptStatus.Success -or $receiptStatus.Groups['status'].Value -ne 'passed' -or -not $receiptCommit.Success) {
                  $failureReason = "main-verification receipt for Issue #$issueNumber is invalid"
              } else {
                  $mergeCommit = $receiptCommit.Groups['sha'].Value
                  $comparison = gh api "repos/$($env:REPOSITORY)/compare/$mergeCommit...main" | ConvertFrom-Json
                  if ($comparison.status -notin @('ahead', 'identical')) {
                      $failureReason = "receipt merge commit $mergeCommit is not reachable from main"
                  }
              }
          }

          if ($null -ne $failureReason) {
              $comment = @"
          Issue close guard reopened #$issueNumber because main verification is incomplete: $failureReason.

          Complete the main-branch verification and record Branch, PR, Merge commit, Main verification, and Tests before closing the Issue again.
          "@
              gh api --method PATCH "repos/$($env:REPOSITORY)/issues/$issueNumber" -f state=open | Out-Null
              gh api --method POST "repos/$($env:REPOSITORY)/issues/$issueNumber/comments" -f body=$comment | Out-Null
          throw $failureReason
          }

          Write-Host "Issue #$issueNumber passed receipt and main reachability checks. API calls=2 (receipt comments + compare)."
