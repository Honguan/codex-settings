model = "gpt-5.6"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
review_model = "gpt-5.6"

# Detect normal Git repositories and CVS repositories prepared by this package.
project_root_markers = [".git", ".codex-root"]

# AGENTS.md remains the preferred filename. These names are compatibility fallbacks.
project_doc_fallback_filenames = ["AGENT.md", "agent.md"]
project_doc_max_bytes = 65536

# Context7 remote MCP. The installer can store CONTEXT7_API_KEY in the
# current user's environment; Codex sends it without writing the secret here.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }

# Browser automation through Microsoft's official Playwright MCP server.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120
